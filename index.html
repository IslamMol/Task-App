<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Путь">
<title>Путь — жизненные квесты</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
  @font-face{
    font-family:'Nofex';
    src:url('Nofex.otf') format('opentype');
    font-weight:400 800;
    font-display:swap;
  }
  :root{
    --bg:#0D1433; --card:#171F55; --card2:#1e2a63; --text:#eef0f8; --muted:#8b93bf;
    --border:#274272; --accent:#6C90C3;
    --c-quest:#6C90C3; --c-habit:#E8B75D; --c-book:#5FC9A8; --c-note:#E2735E;
  }
  [data-theme="light"]{
    --bg:#F4F6FB; --card:#FFFFFF; --card2:#EDF1FA; --text:#0D1433; --muted:#5c6690;
    --border:#D7DEF2; --accent:#274272;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{margin:0; font-family:'Nofex',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; background:var(--bg); color:var(--text); padding-bottom:120px; transition:background .2s,color .2s;}
  header{padding:20px 16px 8px; position:sticky; top:0; background:var(--bg); z-index:10; display:flex; justify-content:space-between; align-items:center;}
  h1{font-size:24px; margin:0 0 2px; letter-spacing:.3px; font-weight:700;}
  .sub{color:var(--muted); font-size:13px;}
  .header-actions{display:flex; gap:8px;}
  .icon-btn{background:var(--card); border:1px solid var(--border); border-radius:50%; width:42px; height:42px; font-size:17px; color:var(--text); display:flex; align-items:center; justify-content:center;}
  .icon-btn.active{background:var(--accent); border-color:var(--accent);}
  .theme-btn{background:var(--card); border:1px solid var(--border); border-radius:50%; width:42px; height:42px; font-size:16px; color:var(--text);}
  .tabs{display:none;}
  .bottom-nav{position:fixed; left:16px; right:16px; bottom:18px; z-index:20; background:var(--card); border:1px solid var(--border); border-radius:28px; box-shadow:0 12px 30px rgba(0,0,0,.35); display:flex; align-items:center; justify-content:space-around; padding:10px 8px; height:64px;}
  .nav-item{background:none; border:none; display:flex; flex-direction:column; align-items:center; gap:2px; color:var(--muted); font-size:10px; flex:1;}
  .nav-item .ic{font-size:19px;}
  .nav-item.active{color:var(--nav-color, var(--accent));}
  .nav-item[data-type="quest"].active{--nav-color:var(--c-quest);}
  .nav-item[data-type="habit"].active{--nav-color:var(--c-habit);}
  .nav-item[data-type="book"].active{--nav-color:var(--c-book);}
  .nav-item[data-type="note"].active{--nav-color:var(--c-note);}
  .nav-add{position:relative; top:-26px; width:56px; height:56px; border-radius:50%; background:var(--accent); color:#fff; border:5px solid var(--bg); font-size:26px; display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(108,144,195,.5); flex:0 0 auto;}
  main{padding:0 16px;}
  .compass-row{display:flex; gap:10px; margin-bottom:20px; overflow-x:auto;}
  .compass-card{flex:1; min-width:150px; border-radius:26px; padding:16px; position:relative; overflow:hidden; min-height:120px; border:1px solid var(--border);}
  .compass-card.has-cover{color:#fff;}
  .compass-card .cover-bg{position:absolute; inset:0; background-size:cover; background-position:center; opacity:.55; z-index:0;}
  .compass-card .cover-grad{position:absolute; inset:0; z-index:0;}
  .compass-card.dream .cover-grad{background:linear-gradient(145deg,#274272,#171F55);}
  .compass-card.goal .cover-grad{background:linear-gradient(145deg,#3a5490,#171F55);}
  .compass-card.path .cover-grad{background:linear-gradient(145deg,#1e2a63,#171F55);}
  .compass-card > *:not(.cover-bg):not(.cover-grad){position:relative; z-index:1;}
  .compass-card h3{margin:0 0 8px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px;}
  .compass-card.has-cover h3{color:rgba(255,255,255,.75);}
  .compass-card .title{font-size:15px; font-weight:600; margin-bottom:8px; min-height:20px;}
  .bar{height:6px; background:rgba(255,255,255,.15); border-radius:4px; overflow:hidden; margin-bottom:4px;}
  [data-theme="light"] .compass-card:not(.has-cover) .bar{background:var(--border);}
  .bar-fill{height:100%; background:var(--c-book); border-radius:4px; transition:width .4s ease;}
  .pct{font-size:12px; color:var(--muted);}
  .compass-card.has-cover .pct{color:rgba(255,255,255,.75);}
  .card{background:var(--card); border:1px solid var(--border); border-radius:22px; padding:16px; margin-bottom:12px; border-left:5px solid var(--type-color, var(--border));}
  .card-row{display:flex; align-items:center; gap:12px;}
  .check{width:28px; height:28px; border-radius:50%; border:2px solid var(--muted); flex:0 0 auto; display:flex; align-items:center; justify-content:center; font-size:15px; transition:transform .15s;}
  .check.pop{animation:pop .35s ease;}
  @keyframes pop{0%{transform:scale(1);} 40%{transform:scale(1.35);} 100%{transform:scale(1);}}
  .check.done{background:var(--type-color); border-color:var(--type-color); color:#12131a;}
  .card-title{font-size:15px; font-weight:600; flex:1;}
  .card-title.done{text-decoration:line-through; color:var(--muted);}
  .card-meta{font-size:12px; color:var(--muted); margin-top:4px;}
  .progress-input{display:flex; align-items:center; gap:6px; margin-top:8px;}
  .progress-input input{width:60px; background:var(--card2); border:1px solid var(--border); border-radius:8px; color:var(--text); padding:4px 8px; font-size:13px;}
  .goal-chip{display:inline-block; margin-top:6px; font-size:11px; background:var(--card2); color:var(--muted); padding:3px 8px; border-radius:10px;}
  .streak-chip{display:inline-block; margin-top:4px; font-size:12px; color:var(--c-habit); font-weight:600;}
  .modal-bg{position:fixed; inset:0; background:rgba(0,0,0,.6); display:flex; align-items:flex-end; z-index:30;}
  .modal{background:var(--card); width:100%; border-radius:28px 28px 0 0; padding:22px; max-height:80vh; overflow-y:auto;}
  .modal h2{margin-top:0;}
  input,textarea,select{width:100%; background:var(--card2); border:1px solid var(--border); color:var(--text); padding:10px; border-radius:10px; font-size:15px; margin-bottom:10px; font-family:inherit;}
  button.primary{width:100%; padding:12px; background:var(--accent); color:white; border:none; border-radius:12px; font-size:15px; font-weight:600;}
  button.ghost{width:100%; padding:12px; background:transparent; color:var(--muted); border:none; font-size:14px;}
  .login-wrap{display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px;}
  .login-box{width:100%; max-width:340px; text-align:center;}
  .login-box h1{font-size:26px;}
  .empty{color:var(--muted); text-align:center; padding:40px 0; font-size:14px;}
  .journal-entry{border-left:2px solid var(--accent); padding-left:10px; margin-bottom:10px; font-size:14px;}
  .journal-date{font-size:11px; color:var(--muted);}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:8px;}
  .stat-card{background:var(--card); border:1px solid var(--border); border-radius:16px; padding:16px;}
  .stat-num{font-size:26px; font-weight:700;}
  .stat-label{font-size:12px; color:var(--muted); margin-top:2px;}
</style>
</head>
<body>

<div id="authScreen" class="login-wrap" style="display:none;">
  <div class="login-box">
    <h1>Путь</h1>
    <p class="sub" id="authSubtitle">Войди, чтобы продолжить</p>
    <input id="emailInput" type="email" placeholder="Почта" style="margin-top:24px;">
    <input id="passwordInput" type="password" placeholder="Пароль">
    <button class="primary" id="authMainBtn" onclick="signIn()">Войти</button>
    <button class="ghost" onclick="toggleAuthMode()" id="authSwitchBtn">Нет аккаунта? Зарегистрироваться</button>
    <p id="authMsg" class="sub" style="margin-top:8px;"></p>
  </div>
</div>

<div id="appScreen" style="display:none;">
  <header>
    <div>
      <h1>Путь</h1>
      <div class="sub" id="userEmail"></div>
    </div>
    <div class="header-actions">
      <button class="icon-btn" onclick="switchTab('stats')" id="statsBtn">📊</button>
      <button class="theme-btn" onclick="toggleTheme()" id="themeBtn">🌙</button>
    </div>
  </header>

  <div class="compass-row" id="compassRow"></div>

  <main id="list"></main>
</div>

<div class="bottom-nav" id="bottomNav" style="display:none;">
  <button class="nav-item active" data-type="quest" onclick="switchTab('quest')"><span class="ic">🗡️</span>Квесты</button>
  <button class="nav-item" data-type="habit" onclick="switchTab('habit')"><span class="ic">🔥</span>Привычки</button>
  <button class="nav-add" id="fab" onclick="openAdd()">+</button>
  <button class="nav-item" data-type="book" onclick="switchTab('book')"><span class="ic">📚</span>Книги</button>
  <button class="nav-item" data-type="note" onclick="switchTab('note')"><span class="ic">✅</span>Дела</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://bwnlfisppygnmxaylytm.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_A3ymKs56JwPIeYQRuREKpA_byNmqfPs";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const TYPE_COLOR = { quest:'var(--c-quest)', habit:'var(--c-habit)', book:'var(--c-book)', note:'var(--c-note)' };
const CATEGORY_EMOJI = { 'купить':'🛒','не забыть':'📌','сделать':'✅','попробовать':'🌟' };

let currentTab = 'quest';
let session = null;
let entries = [];
let compassItems = [];

function applyTheme(){
  const saved = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', saved);
  const btn = document.getElementById('themeBtn');
  if(btn) btn.textContent = saved==='dark' ? '🌙' : '☀️';
}
function toggleTheme(){
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme();
}
applyTheme();

async function init(){
  const { data } = await sb.auth.getSession();
  session = data.session;
  if(session){ showApp(); } else { showAuth(); }
  sb.auth.onAuthStateChange((event, s) => {
    session = s;
    if(s) showApp(); else showAuth();
  });
}

function showAuth(){
  document.getElementById('authScreen').style.display = 'flex';
  document.getElementById('appScreen').style.display = 'none';
  document.getElementById('fab').style.display = 'none';
}

let authMode = 'signin';

function toggleAuthMode(){
  authMode = authMode === 'signin' ? 'signup' : 'signin';
  document.getElementById('authMainBtn').textContent = authMode === 'signin' ? 'Войти' : 'Зарегистрироваться';
  document.getElementById('authMainBtn').setAttribute('onclick', authMode === 'signin' ? 'signIn()' : 'signUp()');
  document.getElementById('authSwitchBtn').textContent = authMode === 'signin' ? 'Нет аккаунта? Зарегистрироваться' : 'Уже есть аккаунт? Войти';
  document.getElementById('authMsg').textContent = '';
}

async function signIn(){
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const msg = document.getElementById('authMsg');
  if(!email || !password){ msg.textContent = 'Заполни почту и пароль'; return; }
  msg.textContent = 'Вхожу...';
  const { error } = await sb.auth.signInWithPassword({ email, password });
  msg.textContent = error ? 'Ошибка: ' + error.message : '';
}

async function signUp(){
  const email = document.getElementById('emailInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const msg = document.getElementById('authMsg');
  if(!email || !password){ msg.textContent = 'Заполни почту и пароль'; return; }
  if(password.length < 6){ msg.textContent = 'Пароль минимум 6 символов'; return; }
  msg.textContent = 'Создаю аккаунт...';
  const { data, error } = await sb.auth.signUp({ email, password });
  if(error){ msg.textContent = 'Ошибка: ' + error.message; return; }
  if(data.session){ msg.textContent = ''; } else { msg.textContent = 'Проверь почту — нужно подтвердить регистрацию один раз'; }
}

async function showApp(){
  document.getElementById('authScreen').style.display = 'none';
  document.getElementById('appScreen').style.display = 'block';
  document.getElementById('bottomNav').style.display = 'flex';
  document.getElementById('userEmail').textContent = session.user.email;
  applyTheme();
  await ensureCompass();
  await loadEntries();
  renderCompass();
  renderList();
}

async function ensureCompass(){
  const { data } = await sb.from('compass').select('*').order('created_at');
  if(data && data.length >= 3){ compassItems = data; return; }
  const kinds = [['dream','Мечта'],['goal','Цель'],['path','Путь']];
  const existing = (data||[]).map(d=>d.kind);
  const toCreate = kinds.filter(k=>!existing.includes(k[0])).map(k=>({kind:k[0], title:k[1], progress_percent:0}));
  if(toCreate.length){ await sb.from('compass').insert(toCreate); }
  const r2 = await sb.from('compass').select('*').order('created_at');
  compassItems = r2.data || [];
}

async function loadEntries(){
  const { data } = await sb.from('entries').select('*').order('created_at', {ascending:false});
  entries = data || [];
}

function renderCompass(){
  const row = document.getElementById('compassRow');
  const labels = {dream:'Мечта', goal:'Цель', path:'Путь'};
  row.innerHTML = compassItems.map(c => `
    <div class="compass-card ${c.kind} ${c.cover_url?'has-cover':''}" onclick="openCompass('${c.id}')">
      ${c.cover_url ? `<div class="cover-bg" style="background-image:url('${c.cover_url}')"></div><div class="cover-bg" style="background:rgba(0,0,0,.35)"></div>` : `<div class="cover-grad"></div>`}
      <h3>${labels[c.kind]}</h3>
      <div class="title">${c.title || 'Нажми, чтобы задать'}</div>
      ${c.kind !== 'path' ? `
        <div class="bar"><div class="bar-fill" style="width:${c.progress_percent||0}%"></div></div>
        <div class="pct">${c.progress_percent||0}%</div>
      ` : `<div class="pct">Открыть дневник →</div>`}
    </div>
  `).join('');
}

function switchTab(type){
  currentTab = type;
  document.querySelectorAll('.nav-item').forEach(t=>t.classList.toggle('active', t.dataset.type===type));
  document.getElementById('statsBtn').classList.toggle('active', type==='stats');
  document.getElementById('fab').style.display = type==='stats' ? 'none' : 'flex';
  renderList();
}

function categoryEmoji(cat){
  if(!cat) return '';
  const key = cat.trim().toLowerCase();
  return CATEGORY_EMOJI[key] ? CATEGORY_EMOJI[key] + ' ' : '🔖 ';
}

function renderList(){
  const list = document.getElementById('list');
  if(currentTab === 'stats'){ renderStats(list); return; }

  const items = entries.filter(e=>e.type===currentTab);
  if(items.length===0){ list.innerHTML = '<div class="empty">Пока пусто. Нажми + чтобы добавить</div>'; return; }

  list.innerHTML = items.map(e => {
    const color = TYPE_COLOR[e.type];
    if(e.type === 'book'){
      const pct = e.progress_total ? Math.round((e.progress_current/e.progress_total)*100) : 0;
      const goal = e.goal_id ? compassItems.find(c=>c.id===e.goal_id) : null;
      return `<div class="card" style="--type-color:${color}">
        <div class="card-title">${escapeHtml(e.title)}</div>
        <div class="card-meta">${e.progress_current||0} из ${e.progress_total||'?'} стр. (${pct}%)</div>
        <div class="bar" style="margin-top:8px;"><div class="bar-fill" style="width:${pct}%; background:${color}"></div></div>
        <div class="progress-input">
          <input type="number" value="${e.progress_current||0}" onchange="updatePage('${e.id}', this.value)">
          <span class="card-meta">стр. прочитано</span>
          <button class="ghost" style="width:auto; padding:4px 10px;" onclick="deleteEntry('${e.id}')">✕</button>
        </div>
        ${goal ? `<div class="goal-chip">🎯 к цели: ${escapeHtml(goal.title||'без названия')}</div>` : ''}
      </div>`;
    }
    if(e.type === 'habit'){
      const today = new Date().toISOString().slice(0,10);
      const doneToday = e.last_done_date === today;
      return `<div class="card" style="--type-color:${color}">
        <div class="card-row">
          <div class="check ${doneToday?'done':''}" onclick='toggleHabit(${JSON.stringify(e.id)}, this)'>${doneToday?'✓':''}</div>
          <div style="flex:1;">
            <div class="card-title">${escapeHtml(e.title)}</div>
            <div class="streak-chip">${e.streak>0 ? `🔥 ${e.streak} дн. подряд` : 'начни сегодня'}</div>
          </div>
          <button class="ghost" style="width:auto; padding:4px 10px;" onclick="deleteEntry('${e.id}')">✕</button>
        </div>
      </div>`;
    }
    return `<div class="card" style="--type-color:${color}">
      <div class="card-row">
        <div class="check ${e.done?'done':''}" onclick="toggleDone('${e.id}', ${!e.done}, this)">${e.done?'✓':''}</div>
        <div style="flex:1;">
          <div class="card-title ${e.done?'done':''}">${escapeHtml(e.title)}</div>
          ${e.category ? `<div class="card-meta">${categoryEmoji(e.category)}${escapeHtml(e.category)}</div>` : ''}
        </div>
        <button class="ghost" style="width:auto; padding:4px 10px;" onclick="deleteEntry('${e.id}')">✕</button>
      </div>
    </div>`;
  }).join('');
}

function renderStats(list){
  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const inMonth = (d) => new Date(d) >= monthStart;

  const questsDone = entries.filter(e=>e.type==='quest' && e.done && inMonth(e.updated_at)).length;
  const today = new Date().toISOString().slice(0,10);
  const habitsDone = entries.filter(e=>e.type==='habit' && e.last_done_date === today).length;
  const pagesRead = entries.filter(e=>e.type==='book').reduce((s,e)=>s+(Number(e.progress_current)||0),0);
  const notesDone = entries.filter(e=>e.type==='note' && e.done && inMonth(e.updated_at)).length;

  list.innerHTML = `
    <div class="sub" style="margin:12px 0;">За этот месяц</div>
    <div class="stat-grid">
      <div class="stat-card" style="border-left:4px solid var(--c-quest)">
        <div class="stat-num">${questsDone}</div>
        <div class="stat-label">квестов выполнено</div>
      </div>
      <div class="stat-card" style="border-left:4px solid var(--c-habit)">
        <div class="stat-num">${habitsDone}</div>
        <div class="stat-label">привычек выполнено сегодня</div>
      </div>
      <div class="stat-card" style="border-left:4px solid var(--c-book)">
        <div class="stat-num">${pagesRead}</div>
        <div class="stat-label">страниц прочитано всего</div>
      </div>
      <div class="stat-card" style="border-left:4px solid var(--c-note)">
        <div class="stat-num">${notesDone}</div>
        <div class="stat-label">дел закрыто</div>
      </div>
    </div>
  `;
}

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }

async function toggleDone(id, done, el){
  if(el){ el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'), 350); }
  await sb.from('entries').update({done, updated_at: new Date().toISOString()}).eq('id', id);
  await loadEntries();
  setTimeout(renderList, 120);
}

async function toggleHabit(id, el){
  const e = entries.find(x=>x.id===id);
  const today = new Date().toISOString().slice(0,10);
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0,10);

  if(el){ el.classList.add('pop'); setTimeout(()=>el.classList.remove('pop'), 350); }

  if(e.last_done_date === today){
    const newStreak = Math.max(0, (e.streak||1) - 1);
    const newLastDate = newStreak > 0 ? yesterday : null;
    await sb.from('entries').update({streak:newStreak, last_done_date:newLastDate}).eq('id', id);
  } else {
    const newStreak = e.last_done_date === yesterday ? (e.streak||0)+1 : 1;
    await sb.from('entries').update({streak:newStreak, last_done_date:today}).eq('id', id);
  }
  await loadEntries();
  setTimeout(renderList, 120);
}

async function updatePage(id, val){
  await sb.from('entries').update({progress_current: Number(val), updated_at: new Date().toISOString()}).eq('id', id);
  await loadEntries(); renderList();
}

async function deleteEntry(id){
  await sb.from('entries').delete().eq('id', id);
  await loadEntries(); renderList();
}

function openAdd(){
  const isBook = currentTab === 'book';
  const goals = compassItems.filter(c=>c.kind==='goal');
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.onclick = (e)=>{ if(e.target===modal) modal.remove(); };
  modal.innerHTML = `
    <div class="modal">
      <h2>Новая запись</h2>
      <input id="newTitle" placeholder="Название">
      ${!isBook ? '<input id="newCat" placeholder="Категория (Купить / Не забыть / Сделать / Попробовать)">' : ''}
      ${isBook ? '<input id="newTotal" type="number" placeholder="Всего страниц">' : ''}
      ${isBook && goals.length ? `<select id="newGoal"><option value="">Не связано с целью</option>${goals.map(g=>`<option value="${g.id}">🎯 ${escapeHtml(g.title||'Цель')}</option>`).join('')}</select>` : ''}
      <button class="primary" onclick="saveNew(${isBook})">Сохранить</button>
      <button class="ghost" onclick="this.closest('.modal-bg').remove()">Отмена</button>
    </div>`;
  document.body.appendChild(modal);
}

async function saveNew(isBook){
  const title = document.getElementById('newTitle').value.trim();
  if(!title) return;
  const row = { type: currentTab, title, user_id: session.user.id };
  if(isBook){
    row.progress_total = Number(document.getElementById('newTotal').value) || null;
    row.progress_current = 0;
    const goalSel = document.getElementById('newGoal');
    if(goalSel && goalSel.value) row.goal_id = goalSel.value;
  } else {
    const cat = document.getElementById('newCat');
    if(cat) row.category = cat.value.trim();
  }
  await sb.from('entries').insert(row);
  document.querySelector('.modal-bg').remove();
  await loadEntries(); renderList();
}

async function openCompass(id){
  const c = compassItems.find(x=>x.id===id);
  const modal = document.createElement('div');
  modal.className = 'modal-bg';
  modal.onclick = (e)=>{ if(e.target===modal) modal.remove(); };

  if(c.kind === 'path'){
    const { data: journal } = await sb.from('compass_entries').select('*').eq('compass_id', id).order('created_at', {ascending:false});
    modal.innerHTML = `
      <div class="modal">
        <h2>Путь</h2>
        <input id="pathTitle" placeholder="Кто ты / чем занимаешься" value="${c.title||''}">
        <button class="primary" onclick="savePathTitle('${id}')">Сохранить заголовок</button>
        <hr style="border-color:var(--border); margin:16px 0;">
        <textarea id="journalNote" placeholder="Новая запись в дневник пути..." rows="3"></textarea>
        <button class="primary" onclick="addJournalEntry('${id}')">Добавить запись</button>
        <div style="margin-top:16px;">
          ${(journal||[]).map(j=>`<div class="journal-entry"><div class="journal-date">${new Date(j.created_at).toLocaleDateString('ru-RU')}</div>${escapeHtml(j.note)}</div>`).join('') || '<div class="empty">Записей пока нет</div>'}
        </div>
      </div>`;
  } else {
    modal.innerHTML = `
      <div class="modal">
        <h2>${c.kind==='dream'?'Мечта':'Цель'}</h2>
        <input id="compassTitle" placeholder="Название" value="${c.title||''}">
        <input id="compassCover" placeholder="Ссылка на картинку-обложку (необязательно)" value="${c.cover_url||''}">
        <label class="card-meta">Прогресс: <span id="pctLabel">${c.progress_percent||0}</span>%</label>
        <input id="compassPct" type="range" min="0" max="100" value="${c.progress_percent||0}" oninput="document.getElementById('pctLabel').textContent=this.value">
        <button class="primary" onclick="saveCompass('${id}')">Сохранить</button>
      </div>`;
  }
  document.body.appendChild(modal);
}

async function saveCompass(id){
  const title = document.getElementById('compassTitle').value.trim();
  const pct = Number(document.getElementById('compassPct').value);
  const cover = document.getElementById('compassCover').value.trim();
  await sb.from('compass').update({title, progress_percent: pct, cover_url: cover || null}).eq('id', id);
  document.querySelector('.modal-bg').remove();
  await ensureCompass(); renderCompass();
}

async function savePathTitle(id){
  const title = document.getElementById('pathTitle').value.trim();
  await sb.from('compass').update({title}).eq('id', id);
  await ensureCompass(); renderCompass();
}

async function addJournalEntry(compassId){
  const note = document.getElementById('journalNote').value.trim();
  if(!note) return;
  await sb.from('compass_entries').insert({compass_id: compassId, user_id: session.user.id, note});
  document.querySelector('.modal-bg').remove();
  openCompass(compassId);
}

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
}

init();
</script>
</body>
</html>
