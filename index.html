<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fbf4ec">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Путь">
<title>Путь — планер</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --gesso-canvas:#fbf4ec;--gesso-surface:#fff;--gesso-surface-recessed:#f1eae3;--gesso-surface-elevated:#f5f5f5;
  --gesso-fg:#1a1a1a;--gesso-fg-muted:#6e655e;--gesso-primary:#ffad61;--gesso-secondary:#c95be0;
  --gesso-accent:#4b5a8c;--gesso-accent-text:#8c5f35;--gesso-divider:rgba(0,0,0,.05);
  --gesso-data-1:#85049b;--gesso-data-2:#9f2eb5;--gesso-data-3:#b94bd0;--gesso-data-4:#5a9a7a;--gesso-data-5:#b0576a;
  --gesso-success:#149343;--gesso-warning:#c36b05;--gesso-error:#dc2626;
  --r-sm:8px;--r-md:16px;--r-lg:24px;--r-full:9999px;
  --shadow-lg:0 1px 2px rgba(0,0,0,.04);--shadow-card:0 4px 16px rgba(26,20,10,.06);
  --motion:160ms;--ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--gesso-canvas);color:var(--gesso-fg);font-family:Manrope,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body{overflow-x:hidden;background:radial-gradient(circle,rgba(26,26,26,.05) 1px,transparent 1.2px) 0 0/16px 16px,var(--gesso-canvas)}
button,input,select,textarea{font:inherit}
button{border:0;background:none;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
svg{display:block}
#authScreen,#appScreen{min-height:100dvh}
#authScreen{display:none;align-items:center;justify-content:center;padding:24px;background:var(--gesso-canvas)}
.auth-card{width:min(100%,380px);background:var(--gesso-surface);border-radius:24px;padding:24px;box-shadow:var(--shadow-card)}
.auth-card h1{margin:0;font-size:34px;line-height:1.1}
.auth-kicker{color:var(--gesso-fg-muted);font-size:13px;margin:7px 0 22px}
.auth-input{width:100%;background:var(--gesso-surface);border:1px solid #c4ccdb;border-radius:16px;padding:12px 16px;margin-top:10px;outline:none}
.auth-input:focus{border-color:var(--gesso-primary);box-shadow:0 0 0 3px rgba(255,173,97,.14)}
.auth-primary{width:100%;margin-top:12px;background:var(--gesso-accent);color:#fff;border-radius:16px;padding:12px 18px;font-weight:700}
.auth-secondary{width:100%;padding:12px 18px;color:var(--gesso-accent);font-weight:600}
#appScreen{display:none}
.app-shell{width:min(100%,393px);margin:0 auto;padding:44px 16px 96px}
.page{display:none}
.page.active{display:block}
.screen-stack{display:flex;flex-direction:column;gap:24px}
.greeting{display:flex;align-items:center;justify-content:space-between;gap:12px}
.greeting .hi{font-size:13px;color:var(--gesso-fg-muted);font-weight:500}
.greeting h1{font-size:30px;line-height:34px;font-weight:800;margin:2px 0 0;letter-spacing:-.02em}
.avatar-button{width:40px;height:40px;border-radius:50%;background:var(--gesso-surface-recessed);border:1px solid var(--gesso-divider);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
.avatar-button img{width:100%;height:100%;object-fit:cover}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.section-head h2{margin:0;font-size:19px;line-height:1.2;font-weight:800;letter-spacing:-.01em}
.view-all{padding:4px 0;font-size:12px;font-weight:700;color:var(--gesso-accent)}
.hero-card{background:var(--gesso-surface);border-radius:24px;padding:18px 20px 20px;box-shadow:var(--shadow-card);display:flex;flex-direction:column;align-items:center;gap:10px}
.ring-wrap{position:relative;width:152px;height:152px}
.ring-wrap svg{width:100%;height:100%}
.ring-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.ring-center .num{font-size:43px;line-height:48px;font-weight:800;letter-spacing:-.03em}
.ring-center .lbl{font-size:8px;letter-spacing:.05em;color:var(--gesso-fg-muted);font-weight:700;text-transform:uppercase}
.hero-sub{text-align:center;font-size:12px;color:var(--gesso-fg-muted);max-width:290px;line-height:1.45;margin:0}
.hero-sub strong{color:var(--gesso-fg)}
.ring-progress{animation:gesso-path-draw 700ms var(--ease) forwards}
@keyframes gesso-path-draw{from{stroke-dashoffset:502}to{stroke-dashoffset:calc(502 * (1 - var(--p)))}}
.habit-card,.simple-card,.finance-card,.reading-card{background:var(--gesso-surface);border-radius:16px;padding:16px;box-shadow:var(--shadow-card)}
.habit-bar{display:flex;height:39px;overflow:hidden;border-radius:12px}
.habit-seg{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:800;min-width:14px}
.habit-legend{display:grid;grid-template-columns:1fr 1fr;gap:9px 12px;margin-top:12px}
.habit-legend .item{display:flex;align-items:center;gap:6px;font-size:10px;color:var(--gesso-fg-muted);font-weight:600;min-width:0}
.habit-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.task-list{display:flex;flex-direction:column;gap:8px}
.task-row{display:flex;align-items:center;gap:9px;background:var(--gesso-surface-recessed);border-radius:12px;padding:10px 11px;min-height:42px}
.task-row:active{transform:scale(.995)}
.task-check{width:22px;height:22px;border-radius:50%;border:1.5px solid #8d8b88;background:#fff;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.task-check.done{background:var(--gesso-accent);border-color:var(--gesso-accent);color:#fff}
.task-dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.task-text{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1}
.task-title{font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task-title.done{text-decoration:line-through;color:var(--gesso-fg-muted);font-weight:600}
.task-meta{font-size:8px;color:var(--gesso-fg-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.completed-card{display:flex;align-items:center;justify-content:space-between;gap:12px}
.completed-label{font-size:9px;color:var(--gesso-fg-muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.completed-value{font-size:20px;font-weight:800;line-height:1.1;margin-top:3px}
.primary-pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--gesso-accent);color:#fff;border-radius:9999px;padding:9px 13px;font-size:10px;font-weight:800}
.finance-balance{font-size:26px;line-height:1.1;font-weight:800;letter-spacing:-.03em;margin-top:4px}
.finance-label{font-size:9px;color:var(--gesso-fg-muted);font-weight:700;letter-spacing:.05em}
.finance-actions{display:flex;gap:8px;margin-top:12px}
.finance-actions .primary-pill{flex:1}
.secondary-pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--gesso-divider);background:var(--gesso-surface-recessed);border-radius:9999px;padding:9px 13px;font-size:10px;font-weight:800}
.finance-actions .secondary-pill{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--gesso-divider);background:var(--gesso-surface-recessed);border-radius:9999px;padding:9px 13px;font-size:10px;font-weight:800}
.finance-cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:11px}
.finance-cat{background:var(--gesso-surface-recessed);border-radius:12px;padding:9px;min-width:0}
.finance-cat .amt{font-size:12px;font-weight:800}
.finance-cat .name{display:block;margin-top:4px;font-size:8px;text-transform:uppercase;letter-spacing:.04em;color:var(--gesso-fg-muted);font-weight:700}
.reading-card{display:flex;align-items:center;gap:14px;padding:14px 16px}
.book-cover{width:56px;height:78px;flex:0 0 auto;border-radius:4px 8px 8px 4px;background:linear-gradient(120deg,#4b5a8c,#6b78a8);box-shadow:0 3px 10px rgba(75,90,140,.28),inset 3px 0 0 rgba(0,0,0,.15),inset -1px 0 0 rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;position:relative}
.book-cover:before{content:"";position:absolute;left:3px;top:0;bottom:0;width:3px;background:rgba(0,0,0,.18)}
.book-cover .book-pct{position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);background:#fff;border-radius:9999px;padding:2px 7px;font-size:9px;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.12);white-space:nowrap}
.read-title{font-size:13px;font-weight:800}
.read-meta{font-size:9px;color:var(--gesso-fg-muted);margin-top:3px}
.dashboard-empty{background:var(--gesso-surface);border-radius:16px;padding:22px 16px;text-align:center;box-shadow:var(--shadow-card);color:var(--gesso-fg-muted);font-size:11px}
.page-title{font-size:30px;line-height:1.1;font-weight:800;letter-spacing:-.02em;margin:0}
.segmented{display:flex;gap:8px;margin:16px 0 12px}
.segmented button{padding:8px 13px;background:#ece8e3;color:#73706d;border-radius:9999px;font-size:11px;font-weight:800}
.segmented button.active{background:var(--gesso-accent);color:#fff}
.list-card{background:var(--gesso-surface);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow-card);margin-bottom:9px}
.list-row{display:flex;align-items:center;gap:10px}
.list-actions{margin-left:auto;display:flex;gap:4px}
.icon-plain{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--gesso-fg-muted)}
.icon-plain:active{background:var(--gesso-surface-recessed)}
.meta-small{font-size:9px;color:var(--gesso-fg-muted)}
.input-line{width:100%;background:#fff;border:1px solid #c4ccdb;border-radius:16px;padding:11px 14px;outline:none}
.input-line:focus{border-color:var(--gesso-primary);box-shadow:0 0 0 3px rgba(255,173,97,.14)}
.calendar-top{display:flex;align-items:center;justify-content:space-between;margin-top:8px}
.calendar-caption{font-size:24px;font-weight:800;letter-spacing:-.02em}
.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:10px}
.calendar-cell{min-height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--gesso-fg)}
.calendar-cell.weekday{color:var(--gesso-fg-muted);font-size:8px}
.calendar-cell.muted{color:#bbb5ae}
.calendar-cell.selected{background:var(--gesso-accent);color:#fff}
.calendar-cell.today{outline:1px solid rgba(75,90,140,.4)}
.event-card{background:var(--gesso-surface);border-radius:16px;padding:14px;box-shadow:var(--shadow-card);margin-top:14px}
.event-empty{text-align:center;color:var(--gesso-fg-muted);font-size:10px;padding:14px}
.settings-profile{display:flex;align-items:center;gap:12px;background:var(--gesso-surface);padding:16px;border-radius:24px;box-shadow:var(--shadow-card)}
.settings-avatar{width:54px;height:54px;border-radius:50%;background:var(--gesso-surface-recessed);display:flex;align-items:center;justify-content:center;overflow:hidden;flex:0 0 auto}
.settings-avatar img{width:100%;height:100%;object-fit:cover}
.settings-name{font-size:16px;font-weight:800}
.settings-email{font-size:10px;color:var(--gesso-fg-muted);margin-top:3px}
.settings-block{background:var(--gesso-surface);border-radius:24px;padding:15px 16px;box-shadow:var(--shadow-card)}
.settings-kicker{font-size:10px;color:var(--gesso-fg-muted);font-weight:800;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.settings-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--gesso-divider);font-size:11px}
.settings-row:last-child{border-bottom:0}
.reorder-buttons{display:flex;gap:4px}
.circle-mini{width:28px;height:28px;border-radius:50%;background:#f1eeeb;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--gesso-fg-muted)}
.lang-row{display:flex;gap:8px}
.lang-pill{border-radius:9999px;padding:9px 14px;background:#ece8e3;color:#75716d;font-size:11px;font-weight:800}
.lang-pill.active{background:var(--gesso-accent);color:#fff}
.bottom-nav{position:fixed;left:50%;transform:translateX(-50%);bottom:4px;width:min(calc(100% - 8px),393px);z-index:100;display:flex;justify-content:space-around;align-items:center;padding:7px 7px calc(7px + env(safe-area-inset-bottom,0px));background:rgba(251,244,236,.92);backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);border:1px solid var(--gesso-divider);border-radius:24px;box-shadow:0 4px 18px rgba(26,20,10,.08)}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 7px;color:var(--gesso-fg-muted);min-width:56px}
.nav-item svg{width:20px;height:20px}
.nav-item span{font-size:8px;font-weight:800}
.nav-item.active{color:var(--gesso-accent)}
.nav-item.active .nav-pill{background:#eeecea}
.nav-pill{width:38px;height:27px;border-radius:9999px;display:flex;align-items:center;justify-content:center}
.fab{display:none}
.modal-bg{position:fixed;inset:0;background:rgba(26,26,26,.4);backdrop-filter:blur(12px);z-index:200;display:flex;align-items:flex-end}
.modal{width:min(100%,560px);margin:0 auto;background:var(--gesso-canvas);border:1px solid #e0dfdc;border-radius:24px 24px 0 0;padding:20px;box-shadow:0 8px 32px rgba(0,0,0,.08);max-height:85dvh;overflow:auto}
.modal-handle{width:40px;height:4px;border-radius:99px;background:#c5c0ba;margin:0 auto 12px}
.modal h2{margin:0 0 12px;font-size:22px}
.modal input,.modal select{width:100%;background:#fff;border:1px solid #c4ccdb;border-radius:16px;padding:11px 14px;outline:none;margin-bottom:9px}
.modal button.primary{width:100%;background:var(--gesso-accent);color:#fff;border-radius:16px;padding:12px 16px;font-weight:800;margin-top:2px}
.modal button.ghost{width:100%;padding:11px;color:var(--gesso-fg-muted);font-weight:700}
.dark-legacy{display:none}
@media (min-width:700px){.app-shell{padding-top:36px}.bottom-nav{bottom:16px;border:1px solid var(--gesso-divider);border-radius:24px;box-shadow:0 4px 18px rgba(26,20,10,.08)}body{background:#eee8df}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="authScreen">
  <div class="auth-card">
    <h1>Путь</h1>
    <div class="auth-kicker" id="authSubtitle">Войди, чтобы продолжить</div>
    <input class="auth-input" id="emailInput" type="email" placeholder="Почта" autocomplete="email">
    <input class="auth-input" id="passwordInput" type="password" placeholder="Пароль" autocomplete="current-password">
    <button class="auth-primary" id="authMainBtn" onclick="signIn()">Войти</button>
    <button class="auth-secondary" id="authSwitchBtn" onclick="toggleAuthMode()">Нет аккаунта? Зарегистрироваться</button>
    <div class="auth-kicker" id="authMsg"></div>
  </div>
</div>

<div id="appScreen">
  <main class="app-shell">
    <section class="page active" id="page-home"><div id="dashboardRoot"></div></section>
    <section class="page" id="page-tasks"><div id="tasksRoot"></div></section>
    <section class="page" id="page-calendar"><div id="calendarList"></div></section>
    <section class="page" id="page-finance"><div id="financeRoot"></div></section>
    <section class="page" id="page-settings"><div id="settingsView"></div></section>
    <div id="legacyMount" style="display:none"><div id="compassRow"></div><div id="homeSubtabs"></div><div id="home-habit"></div><div id="home-note"></div><div id="home-finance"></div><div id="taskSubtabs"></div><div id="task-quest"></div><div id="task-book"></div><div id="statsView"></div></div>
  </main>
</div>

<nav class="bottom-nav" id="bottomNav" style="display:none">
  <button class="nav-item active" data-type="home" onclick="switchMainTab('home')"><span class="nav-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/></svg></span><span>Сегодня</span></button>
  <button class="nav-item" data-type="tasks" onclick="switchMainTab('tasks')"><span class="nav-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="m8.5 12 2.2 2.2 4.8-5"/></svg></span><span>Задачи</span></button>
  <button class="nav-item" data-type="calendar" onclick="switchMainTab('calendar')"><span class="nav-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg></span><span>Календарь</span></button>
  <button class="nav-item" data-type="finance" onclick="switchMainTab('finance')"><span class="nav-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h14a2 2 0 0 1 2 2v9H6a2 2 0 0 1-2-2Z"/><path d="M4 7V5a2 2 0 0 1 2-2h12"/><path d="M16 13h4"/></svg></span><span>Финансы</span></button>
  <button class="nav-item" data-type="settings" onclick="switchMainTab('settings')"><span class="nav-pill"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="7" r="4"/><path d="M5 21a7 7 0 0 1 14 0"/></svg></span><span>Мой путь</span></button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dexie@3/dist/dexie.min.js"></script>
<script type="module" src="src/app.js"></script>
</body>
</html>
